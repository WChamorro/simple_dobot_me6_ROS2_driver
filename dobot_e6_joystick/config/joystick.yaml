dobot_e6_joystick:
  ros__parameters:

    # ============================================================
    # General control
    # ============================================================

    # Frequency at which joint velocity commands are published [Hz]
    publish_frequency_hz: 30.0

    # Maximum allowed time without receiving a /joy message [s]
    # If exceeded while moving, a zero velocity command is sent.
    joy_timeout_s: 0.25

    # Analog joystick deadzone.
    # Values inside [-deadzone, +deadzone] are treated as zero.
    deadzone: 0.08


    # ============================================================
    # Velocity configuration
    # ============================================================

    # Maximum velocity generated by analog sticks [rad/s].
    #
    # Joints 1-4 are proportional:
    #
    # q_dot = joystick_value * analog_max_velocity_rad_s
    #
    # Therefore:
    #   joystick = 0.0  -> 0.0 rad/s
    #   joystick = 0.5  -> approximately 0.5 rad/s
    #   joystick = 1.0  -> 1.0 rad/s
    #
    analog_max_velocity_rad_s: 1.0

    # Constant velocity used by the digital buttons controlling
    # joints 5 and 6 [rad/s].
    button_velocity_rad_s: 0.5


    # ============================================================
    # Analog stick mapping
    # ============================================================

    # Left stick vertical -> Joint 1
    axis_joint1: 0

    # Left stick horizontal -> Joint 2
    axis_joint2: 1

    # Right stick vertical -> Joint 3
    axis_joint3: 2

    # Right stick horizontal -> Joint 4
    axis_joint4: 3


    # ============================================================
    # Analog stick direction
    # ============================================================

    # Change from 1.0 to -1.0 if the physical motion direction
    # is opposite to the desired robot joint direction.

    axis_joint1_sign: 1.0
    axis_joint2_sign: 1.0
    axis_joint3_sign: 1.0
    axis_joint4_sign: 1.0


    # ============================================================
    # Button mapping
    # ============================================================

    # Arrow UP -> Joint 5
    #
    # Replace -1 with the actual button index reported by /joy.
    button_joint5: 6

    # Arrow DOWN -> Joint 6
    #
    # Replace -1 with the actual button index reported by /joy.
    button_joint6: 7

    # Y button -> suction gripper ON/OFF toggle
    #
    # Replace -1 with the actual button index reported by /joy.
    button_suction: 4
    
    
    # X -> stop all joystick joint motion
    button_stop: 3


    # ============================================================
    # Digital joint direction
    # ============================================================

    # Direction of Joint 5 when its button is pressed.
    joint5_button_sign: 1.0

    # Direction of Joint 6 when its button is pressed.
    joint6_button_sign: 1.0
